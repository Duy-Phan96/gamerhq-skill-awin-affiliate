name: Skill CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GAMERHQ_SDK_REF: c27260e8831115f8cf78cc58d5322dbdd101a563

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned GamerHQ Skill SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gamerhq-skill-sdk @ git+https://github.com/Duy-Phan96/GamerHQ.git@${GAMERHQ_SDK_REF}"
      - name: Build Skill wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install built Skill package and test tools
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip install pytest==9.1.1
      - name: Verify installed wheel outside the source tree
        run: |
          cd /tmp
          python -c "from gamerhq_skill_awin_affiliate import create_skill; skill = create_skill(); assert skill.manifest.id == 'awin-affiliate'; assert skill.manifest.version == '0.9.3'"
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest
