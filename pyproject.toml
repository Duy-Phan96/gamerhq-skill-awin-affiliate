[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gamerhq-skill-awin-affiliate"
version = "0.9.1"
description = "Standalone Awin Affiliate Skill for GamerHQ-compatible hosts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "GamerHQ"}]

[project.entry-points."gamerhq.skills"]
awin-affiliate = "gamerhq_skill_awin_affiliate:create_skill"

[tool.setuptools]
packages = ["gamerhq_skill_awin_affiliate"]

[tool.gamerhq]
skill-id = "awin-affiliate"
runtime-api = "1"
sdk = ">=0.1,<0.2"
capabilities = [
  "storage.skill",
  "secrets.skill",
  "http.external",
  "discord.channels.read",
  "discord.messages.send",
  "discord.embeds.send",
  "scheduler.jobs",
  "audit.write",
]
